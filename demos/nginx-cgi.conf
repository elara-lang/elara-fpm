# Example nginx CGI front-end (adjust paths).
server {
    listen 80;
    server_name localhost;
    root /var/www/elara-demos;

    location / {
        include fastcgi_params;
        # Using CGI via a cgi wrapper; prefer FastCGI in production.
        # For true CGI, use a CGI gateway such as fcgiwrap pointing at:
        #   /usr/local/bin/elara-fpm -t /var/www/elara-demos
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/elara-fpm;
        fastcgi_param DOCUMENT_ROOT /var/www/elara-demos;
        fastcgi_param PATH_INFO $uri;
    }
}
